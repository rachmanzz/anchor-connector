version: "3.8"

services:
  anchor-connector:
    build:
      context: ..
      dockerfile: Dockerfile
    image: localhost/anchor-connector:latest
    container_name: anchor-connector
    restart: unless-stopped
    ports:
      - "7448:7448" # AnchorWire Binary TCP Gateway
      - "7447:7447" # HTTP REST & Metrics
    volumes:
      - ./connector.cluster.yaml:/app/config.yaml:ro
      - connector-cold-data:/app/data/cold
    depends_on:
      - anchordb-primary
    networks:
      - anchor-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7447/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  anchordb-primary:
    image: localhost/anchordb:latest
    container_name: anchordb-primary
    restart: unless-stopped
    environment:
      - ANCHORDB_GATEWAY_MODE=true
      - ANCHORDB_NODE_ROLE=primary
      - ANCHORDB_CLUSTER_ID=cluster-prod
    ports:
      - "7458:7448"
      - "7457:7447"
    volumes:
      - primary-data:/var/lib/anchordb/data
    networks:
      - anchor-net

  anchordb-replica-1:
    image: localhost/anchordb:latest
    container_name: anchordb-replica-1
    restart: unless-stopped
    environment:
      - ANCHORDB_GATEWAY_MODE=true
      - ANCHORDB_NODE_ROLE=replica
      - ANCHORDB_PRIMARY_ADDR=anchordb-primary:7448
    ports:
      - "7468:7448"
      - "7467:7447"
    volumes:
      - replica1-data:/var/lib/anchordb/data
    networks:
      - anchor-net

  anchordb-replica-2:
    image: localhost/anchordb:latest
    container_name: anchordb-replica-2
    restart: unless-stopped
    environment:
      - ANCHORDB_GATEWAY_MODE=true
      - ANCHORDB_NODE_ROLE=replica
      - ANCHORDB_PRIMARY_ADDR=anchordb-primary:7448
    ports:
      - "7478:7448"
      - "7477:7447"
    volumes:
      - replica2-data:/var/lib/anchordb/data
    networks:
      - anchor-net

  anchordb-compute-1:
    image: localhost/anchordb:latest
    container_name: anchordb-compute-1
    restart: unless-stopped
    environment:
      - ANCHORDB_GATEWAY_MODE=true
      - ANCHORDB_NODE_ROLE=compute
    ports:
      - "7488:7448"
      - "7487:7447"
    volumes:
      - compute1-data:/var/lib/anchordb/data
    networks:
      - anchor-net

  prometheus:
    image: prom/prometheus:latest
    container_name: anchor-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - anchor-net

  grafana:
    image: grafana/grafana:latest
    container_name: anchor-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - anchor-net

networks:
  anchor-net:
    driver: bridge

volumes:
  connector-cold-data:
  primary-data:
  replica1-data:
  replica2-data:
  compute1-data:
